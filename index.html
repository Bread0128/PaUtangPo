<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Palibre Naman</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #808080, #d3d3d3);
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
}

#main {
    width: 100%;
    padding: 20px;
}

h1 {
    color: #333;
    font-size: clamp(30px, 7vw, 50px);
}

p {
    color: #444;
    font-size: 20px;
}

.buttons {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
    margin-top: 35px;
    min-height: 100px;
}

button {
    border: none;
    padding: 14px 30px;
    border-radius: 30px;
    font-size: 18px;
    cursor: pointer;
    font-weight: bold;
}

#yes {
    background: #333;
    color: white;
    position: relative;
    z-index: 10;
    transition: font-size 0.3s, padding 0.3s;
}

#no {
    background: white;
    color: #333;
    border: 2px solid #555;
    z-index: 11;
}

#success {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 20;
    background: linear-gradient(135deg, #555, #999);
    color: white;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    padding: 25px;
}

#success h1 {
    color: white;
}

#success p {
    color: white;
    line-height: 1.8;
}

</style>
</head>

<body>

<div id="main">
    <h1 id="question">Palibre naman</h1>

    <p id="subtitle">Kahit konti lang..</p>

    <div class="buttons">
        <button id="yes" onclick="sayYes()">Yesss</button>
        <button id="no" onclick="sayNo()">Noo!!</button>
    </div>
</div>

<div id="success">
    <h1>SALAMAT, YA!</h1>
    <p>
        da best ka talaga ya HAHAHAHA!!
        <br>
        ibili ko lang ng jollibee.
        <br>
        Thanks again!!
    </p>
    <h2>Libre ko next time!.</h2>
</div>

<script>
let size = 1;
let noClicks = 0;

const yes = document.getElementById("yes");
const no = document.getElementById("no");
const question = document.getElementById("question");
const subtitle = document.getElementById("subtitle");

const messages = [
    "Sure ka na ba?",
    "Pang-Jollibe lang!",
    "Sige na, please!",
    "Diba mabait ka?",
    "Lalaki na ang OO button!",
    "PALIBRE NA KASI!"
];

function sayNo() {
    noClicks++;

    size *= 1.4;

    yes.style.fontSize = (18 * size) + "px";
    yes.style.padding = (14 * size) + "px " +
                        (30 * size) + "px";

    if (noClicks >= 5) {
        yes.style.position = "fixed";
        yes.style.inset = "0";
        yes.style.width = "100vw";
        yes.style.height = "100vh";
        yes.style.borderRadius = "0";
        yes.style.padding = "0";
        yes.style.fontSize = "50px";
        yes.style.zIndex = "15";
    }

    question.textContent =
        messages[Math.min(noClicks - 1, messages.length - 1)];

    subtitle.textContent =
        "Pautang lang naman, oh!";

    if (noClicks >= 3) {
        no.style.transform =
            "translate(" + (Math.random() * 100 - 50) +
            "px, " + (Math.random() * 80 - 40) + "px)";
    }
}

function sayYes() {
    document.getElementById("success").style.display = "flex";
    yes.style.display = "none";
    no.style.display = "none";
}
</script>

</body>
</html>
